name: abualezz_business_manager
description: "Abu Al-Ezz Business Manager - Enterprise ERP for Retail & POS"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- State Management ---
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # --- Local Database ---
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.2

  # --- UI & Utilities ---
  google_fonts: ^6.1.0
  intl: ^0.19.0
  fl_chart: ^0.66.2
  flutter_barcode_scanner: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
